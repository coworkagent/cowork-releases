# Records the release download counters once a day (see stats/collect.mjs).
name: stats
on:
  schedule:
    # 16:10 UTC is 00:10 in Beijing: each row closes one local day.
    - cron: '10 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # the runner image ships a current Node; the script needs nothing beyond it
      - run: node stats/collect.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/daily.csv docs/stats/daily.json
          git diff --cached --quiet || git commit -m "stats: $(date -u +%F)"
          git push
